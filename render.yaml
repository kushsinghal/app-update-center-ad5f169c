services:
  # Website + API (one Node service)
  - type: web
    name: dealloot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && NITRO_PRESET=node-server npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/public/stats
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: dealloot
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

  # Use an external scheduler to wake the free web service without a paid Render cron job.
  # Call GET /api/public/cron/fetch?key=<CRON_SECRET> every 15 minutes.
